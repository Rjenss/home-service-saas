AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple API + Lambda + Jobs + Customers tables for MVP

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:
  # DynamoDB table to store jobs
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # DynamoDB table to store customers
  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CustomersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Explicit API Gateway so we can configure CORS
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # Single Lambda handling all routes
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mvp-api-function
      Handler: src.app.lambda_handler
      CodeUri: .
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          CUSTOMERS_TABLE: !Ref CustomersTable
          TECHNICIANS_TABLE: !Ref TechniciansTable
          JOB_VISITS_TABLE: !Ref JobVisitsTable
          ORGANIZATION_ID: org_pilot
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TechniciansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref JobVisitsTable
      Events:
        # Root path - so GET / works
        RootGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: get

        HelloApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /hello
            Method: get

        # Jobs endpoints
        JobsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs
            Method: get
        JobsPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs
            Method: post

        # Customers endpoints
        CustomersGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /customers
            Method: get
        CustomersPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /customers
            Method: post

        # technicians endpoints
        TechniciansGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /technicians
            Method: get
        TechniciansPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /technicians
            Method: post

        # job_visits endpoints
        job_visitsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /job_visits
            Method: get
        job_visitsPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /job_visits
            Method: post

Outputs:
  ApiUrl:
    Description: "API base URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod"
