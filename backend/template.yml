AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple API + Lambda + Jobs + Customers + Technicians + JobVisits tables for MVP

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128

Resources:
  # Jobs table
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Customers table
  CustomersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CustomersTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # Technicians table
  TechniciansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TechniciansTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # JobVisits table
  JobVisitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: JobVisitsTable
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # Single Lambda handling all routes
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: mvp-api-function
      Handler: src.app.lambda_handler
      CodeUri: .
      Environment:
        Variables:
          JOBS_TABLE:        !Ref JobsTable
          CUSTOMERS_TABLE:   !Ref CustomersTable
          TECHNICIANS_TABLE: !Ref TechniciansTable
          JOB_VISITS_TABLE:  !Ref JobVisitsTable
          ORGANIZATION_ID:   org_pilot

      SENDER_EMAIL: technisend@gmail.com
      CONFIRM_TOKEN_TTL_HOURS: "48"


      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JobsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CustomersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TechniciansTable
        - DynamoDBCrudPolicy:
            TableName: !Ref JobVisitsTable
      Events:
        # Root path - so GET / works
        RootGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /
            Method: get

        HelloApi:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /hello
            Method: get

        # Jobs endpoints
        JobsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs
            Method: get
        JobsPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /jobs
            Method: post

        # Customers endpoints
        CustomersGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /customers
            Method: get
        CustomersPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /customers
            Method: post

        # Technicians endpoints
        TechniciansGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /technicians
            Method: get
        TechniciansPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /technicians
            Method: post

        # JobVisits endpoints
        JobVisitsGet:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /job_visits
            Method: get
        JobVisitsPost:
          Type: Api
          Properties:
            RestApiId: !Ref ApiGateway
            Path: /job_visits
            Method: post

Outputs:
  ApiUrl:
    Description: "API base URL"
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod"
