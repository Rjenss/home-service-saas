<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jobs Calendar</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Jobs Calendar</h1>
    <p>Internal calendar of scheduled job visits.</p>
    <nav>
      <a href="index.html">Back to portal</a>
      <a href="public-job.html">Create job</a>
      <a href="technicians.html">Manage technicians</a>
    </nav>
  </header>

  <main class="calendar-layout">
    <section class="calendar-controls">
      <div class="calendar-controls-row">
        <div>
          <h2>Schedule</h2>
          <p class="calendar-subtitle">
            View technician job visits one day at a time.
          </p>
        </div>
        <div class="calendar-today-info">
          <div class="calendar-day-nav">
            <button
              id="prevDayBtn"
              class="day-nav-button"
              type="button"
              aria-label="Previous day"
            >
              &#8592;
            </button>

            <div
              id="calendarCurrentDayLabel"
              class="calendar-current-day"
            ></div>

            <button
              id="nextDayBtn"
              class="day-nav-button"
              type="button"
              aria-label="Next day"
            >
              &#8594;
            </button>
          </div>
          <div class="calendar-timezone">
            Times shown in Central Time (CST/CDT)
          </div>
        </div>
      </div>
    </section>

    <section class="calendar-content">
      <div id="calendarStatus" class="calendar-status"></div>
      <div id="calendarJobs" class="calendar-jobs-list"></div>
    </section>
  </main>

  <script src="calendar.js"></script>
</body>
</html>
