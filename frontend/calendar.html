<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jobs calendar</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="page">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">T</span>
        <div class="brand-text">
          <span class="brand-name">Technisend</span>
          <span class="brand-subtitle">Field service control center</span>
        </div>
      </a>
      <nav class="site-nav">
        <a href="index.html">Portal</a>
        <a href="public-job.html">Create job</a>
        <a href="technicians.html">Technicians</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="panel panel-hero">
      <div class="panel-body hero-body hero-body-calendar">
        <div>
          <h1 class="hero-title">Jobs calendar</h1>
          <p class="hero-subtitle">
            See today’s scheduled visits by technician. Step forward and back one day at a time.
          </p>
        </div>
        <div class="calendar-day-nav">
          <button
            id="prevDayBtn"
            class="day-nav-button"
            type="button"
            aria-label="Previous day"
          >
            ←
          </button>

          <div id="calendarCurrentDayLabel" class="calendar-current-day"></div>

          <button
            id="nextDayBtn"
            class="day-nav-button"
            type="button"
            aria-label="Next day"
          >
            →
          </button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-body">
        <div class="calendar-header-row">
          <div class="calendar-timezone">Needs scheduling</div>
          <div id="needsSchedulingStatus" class="calendar-status"></div>
        </div>
        <div id="needsSchedulingJobs" class="calendar-jobs-list"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-body">
        <div class="calendar-header-row">
          <div class="calendar-timezone">
            Times shown in Central time
          </div>
          <div id="calendarStatus" class="calendar-status"></div>
        </div>

        <div id="calendarJobs" class="calendar-jobs-list"></div>
      </div>
    </section>
  </main>

  <div id="scheduleModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">Schedule job</div>
          <div id="scheduleJobMeta" class="modal-subtitle"></div>
        </div>
        <button id="scheduleClose" class="modal-close" type="button">×</button>
      </div>

      <form id="scheduleForm" class="job-form">
        <div class="form-grid">
          <div class="field">
            <label class="field-label" for="scheduleTech">Technician</label>
            <select id="scheduleTech"></select>
          </div>

          <div class="field">
            <label class="field-label" for="scheduleDate">Date</label>
            <input id="scheduleDate" type="date" required />
          </div>

          <div class="field">
            <label class="field-label" for="scheduleTime">Time</label>
            <input id="scheduleTime" type="time" required />
          </div>
        </div>

        <div class="form-footer">
          <button type="submit" class="btn-primary">Schedule</button>
          <div id="scheduleStatus" class="form-status"></div>
        </div>
      </form>
    </div>
  </div>

  <script src="calendar.js"></script>
</body>
</html>
