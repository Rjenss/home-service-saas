<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Technicians</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body class="page">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">T</span>
        <div class="brand-text">
          <span class="brand-name">Technisend</span>
          <span class="brand-subtitle">Field service control center</span>
        </div>
      </a>
      <nav class="site-nav">
        <a href="index.html">Portal</a>
        <a href="public-job.html">Create job</a>
        <a href="calendar.html">Calendar</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="panel panel-hero">
      <div class="panel-body hero-body">
        <div>
          <h1 class="hero-title">Technicians</h1>
          <p class="hero-subtitle">
            Add technicians and view the current roster.
          </p>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-body">
        <h2 class="panel-title">Add technician</h2>

        <form id="techForm" class="job-form">
          <div class="form-grid">
            <div class="field">
              <label class="field-label" for="firstName">First name</label>
              <input type="text" id="firstName" required />
            </div>

            <div class="field">
              <label class="field-label" for="lastName">Last name</label>
              <input type="text" id="lastName" />
            </div>

            <div class="field">
              <label class="field-label" for="phone">Phone</label>
              <input type="text" id="phone" required />
            </div>

            <div class="field">
              <label class="field-label" for="email">Email</label>
              <input type="email" id="email" />
            </div>

            <div class="field">
              <label class="field-label" for="skillTags">Skills (comma-separated)</label>
              <input
                type="text"
                id="skillTags"
                placeholder="PANEL_UPGRADE,EV_CHARGER"
              />
            </div>
          </div>

          <div class="form-footer">
            <button class="btn-primary" type="submit">Save technician</button>
            <div id="techFormStatus" class="form-status"></div>
          </div>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-body">
        <div class="calendar-header-row">
          <div class="calendar-timezone">
            Active technicians
          </div>
          <div id="techListStatus" class="calendar-status"></div>
        </div>

        <div id="techList" class="calendar-jobs-list"></div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE_URL = "https://fdho6lafwk.execute-api.us-east-2.amazonaws.com/Prod";

    function getApiBaseUrl() {
      return API_BASE_URL.replace(/\/+$/, "");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const techForm = document.getElementById("techForm");
      const techFormStatus = document.getElementById("techFormStatus");
      const techListStatus = document.getElementById("techListStatus");
      const techListEl = document.getElementById("techList");

      loadTechnicians();

      techForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const baseUrl = getApiBaseUrl();
        if (!baseUrl) {
          techFormStatus.textContent = "API base URL is not set.";
          return;
        }

        const payload = {
          first_name: document.getElementById("firstName").value.trim(),
          last_name: document.getElementById("lastName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim() || null,
          skill_tags: document.getElementById("skillTags").value.trim() || null,
        };

        if (!payload.first_name) {
          techFormStatus.textContent = "First name is required.";
          return;
        }
        if (!payload.phone) {
          techFormStatus.textContent = "Phone is required.";
          return;
        }

        techFormStatus.textContent = "Saving technician...";

        try {
          const res = await fetch(`${baseUrl}/technicians`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const text = await res.text();
          if (!res.ok) {
            techFormStatus.textContent = `Error: ${res.status} ${text}`;
            return;
          }

          techFormStatus.textContent = "Technician saved.";
          techForm.reset();
          await loadTechnicians();
        } catch (err) {
          techFormStatus.textContent = `Error: ${String(err)}`;
        }
      });

      async function loadTechnicians() {
        const baseUrl = getApiBaseUrl();
        if (!baseUrl) {
          techListStatus.textContent = "API base URL is not set.";
          techListEl.textContent = "";
          return;
        }

        techListStatus.textContent = "Loading...";
        techListEl.textContent = "";

        try {
          const res = await fetch(`${baseUrl}/technicians`, { method: "GET" });

          const text = await res.text();
          if (!res.ok) {
            techListStatus.textContent = `Error: ${res.status}`;
            techListEl.textContent = text;
            return;
          }

          const technicians = JSON.parse(text);
          renderTechnicians(technicians);
          techListStatus.textContent = "";
        } catch (err) {
          techListStatus.textContent = "Error loading technicians.";
          techListEl.textContent = String(err);
        }
      }

      function renderTechnicians(techs) {
        techListEl.innerHTML = "";

        if (!techs || techs.length === 0) {
          const empty = document.createElement("div");
          empty.className = "calendar-empty";
          empty.textContent = "No technicians yet.";
          techListEl.appendChild(empty);
          return;
        }

        for (const tech of techs) {
          const div = document.createElement("div");
          div.className = "job-card visit-card";

          const name = `${tech.first_name || ""} ${tech.last_name || ""}`.trim();
          const phone = tech.phone || "";
          const email = tech.email || "";
          const skills = tech.skill_tags || "";

          div.innerHTML = `
            <div class="job-card-header">
              <div>${escapeHtml(name || "Technician")}</div>
              <div class="visit-status visit-status-scheduled">active</div>
            </div>
            <div class="job-card-body">
              <div class="visit-job-id">Phone: ${escapeHtml(phone)}</div>
              <div>Email: ${escapeHtml(email)}</div>
              <div class="visit-notes">Skills: ${escapeHtml(skills)}</div>
            </div>
          `;

          techListEl.appendChild(div);
        }
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    });
  </script>
</body>
</html>
