<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Field Service Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Field Service Dashboard</h1>
    <p>Internal tool to create service jobs.</p>
  </header>

  <main>
    <!-- SECTION: Create job -->
    <section class="card">
      <h2>Create Job</h2>
      <p>Submit a new job. It will be stored in the backend database.</p>
      <form id="jobForm">
        <div class="field">
          <label for="customerName">Customer name</label>
          <input id="customerName" name="customerName" required />
        </div>

        <div class="field">
          <label for="customerPhone">Customer phone</label>
          <input id="customerPhone" name="customerPhone" />
        </div>

        <div class="field">
          <label for="address">Address</label>
          <input id="address" name="address" />
        </div>

        <div class="field">
          <label for="description">Problem description</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>

        <div class="field">
          <label for="priority">Priority</label>
          <select id="priority" name="priority">
            <option value="normal">Normal</option>
            <option value="urgent">Urgent</option>
            <option value="emergency">Emergency</option>
          </select>
        </div>

        <button type="submit">Create Job</button>
      </form>
      <div id="jobFormStatus" class="status"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
